<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>regime-lab — Historical Analysis</title>
  <script>
    // 테마는 첫 그리기 전에 정한다 (design.md §6.3): 고른 값(localStorage rl.theme) → 없으면 기기 설정
    (function () {
      var v = null;
      try { v = JSON.parse(localStorage.getItem('rl.theme')); } catch (e) { v = null; }
      if (v !== 'light' && v !== 'dark') v = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = v;
    })();
  </script>
  <link rel="stylesheet" href="css/app.css">
  <script src="vendor/echarts.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <div id="root"></div>
  <noscript><p style="padding:24px">This analysis console requires JavaScript.</p></noscript>
  <footer class="disclaimer" id="disclaimer">과거 데이터 분석이며 투자 권유가 아닙니다 · Historical analysis — not investment advice.</footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
