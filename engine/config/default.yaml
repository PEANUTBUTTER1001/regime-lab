# regime-lab 기본 파라미터
# 출처: docs/구현_전_결정사항.md `결정` 열, docs/구현_계획.md §4
# 값을 바꾸려면 먼저 결정 문서를 갱신한다. 실행마다 이 설정 전체가 run 메타데이터에 저장된다.

data:
  as_of_date: "2026-09-18"          # A3 데이터 기준일
  backtest_start: "2020-09-01"      # A2 백테스트 시작일
  warmup_days: 250                  # A2 워밍업 거래일 수
  warmup_source_start: "2019-08-01" # A2 kor_price 보정 구간 시작
  warmup_source_end: "2020-08-31"   # A2 kor_price 보정 구간 끝
  warmup_value_multiplier: 1000000  # kor_price 거래대금(백만원) → 원
  warmup_max_abs_daily_ret: 0.35    # [A2-2 확정 2026-10-01] 보정 워밍업 구간 일간 |수익률| 초과 시 해당 종목 연결 제외 (가격제한 ±30% + 여유)
  markets: [KOSPI, KOSDAQ]

universe:
  kind: "보통주"                     # U2 v_universe_base 조건
  min_listed_days: 250              # U1 첫 거래일 기준 거래일 수
  liquidity_window: 20              # A4
  min_avg_value_krw: 500000000      # A4 20일 평균 거래대금 5억 원
  excluded_depts: ["관리종목(소속부없음)", "투자주의환기종목(소속부없음)"]  # U3 raw/krx_daily.dept 실제 값. KOSPI는 dept가 비어 있어 KOSDAQ만 식별됨

groups:
  marketcap_split: [0.30, 0.40, 0.30]   # A5 대형/중형/소형, 진입일 시장별
  liquidity_split: [0.30, 0.40, 0.30]   # FR-E5 유동성 그룹 (2026-09-22 사용자 결정): 신호일 시장별 20일 평균 거래대금 상위/중간/하위

regime:
  ma_window: 200                    # A6
  slope_window: 20                  # A6 200일선 20일 변화율
  slope_threshold_pct: 1.0          # A6 ±1%
  market_regime_start: "2020-09-01" # X5 과거 지수(cache/warmup/index_warmup.parquet)로 백테스트 시작일부터 산출. 파일이 없으면 지수 이력 부족으로 2021-07-21부터 (A2-1)

indicators:
  rsi_window: 14
  rsi_smoothing: sma                # S5 확정: kor_indicators.RSI_14 는 14일 단순평균(Cutler) 방식과 일치 (Wilder 불일치)
  bb_window: 20
  bb_k: 2.0
  bb_ddof: 0                        # S5 확정: kor_indicators.BB_*_20 은 모집단 표준편차(ddof=0)와 일치
  vwap_window: 20                   # B7 (고+저+종)/3 거래량 가중, t일 포함. 전략에는 t-1일 값

patterns:
  ma_cross_5_20: {fast: 5, slow: 20}
  breakout_20d: {lookback: 20}
  breakout_vol: {lookback: 20, volume_mult: 2.0}
  rsi_rebound: {window: 14, threshold: 30}
  bb_lower_recover: {window: 20, k: 2.0}
  # X6 후순위 5종 (정의: 초안 r1, 2026-10-02 hongsungmin0315 승인 — 구현_전_결정사항 §5.3). 기존 열로만 계산
  three_down_up: {down_days: 3}
  bb_squeeze_break: {squeeze_lookback: 125}
  pullback_ma20: {touch_tolerance_pct: 1.0, max_penetration_pct: 2.0}
  granville_buy1: {slope_days: 5}
  engulfing: {min_body_ratio: 1.0, trend_days: 3}
  # 추가 4종 (2026-10-07 hongsungmin0315 요청, SRS FR-P1 범위 확장 승인 필요). 패턴 안에서 계산 → 준비 프레임 열 추가 없음
  macd_cross: {fast: 12, slow: 26, signal: 9}
  high_52w: {lookback: 250}
  disparity_rebound: {window: 20, threshold: 90.0}
  stochastic_rebound: {k_window: 14, d_window: 3, oversold: 20.0}

pattern_limits:                     # P1-4 조합별로 바꿀 수 있는 패턴 수치와 허용 범위 [최소, 최대]. 기본값은 위 patterns 절.
  # 기간·배수가 준비 프레임 기본값과 다르면 패턴이 같은 지표 함수로 그 자리에서 계산한다 → PREP_VERSION 영향 없음
  ma_cross_5_20: {fast: [2, 60], slow: [5, 250]}            # 2026-10-07 hongsungmin0315: 기간 열기. fast < slow
  breakout_20d: {lookback: [5, 250]}
  breakout_vol: {volume_mult: [1.0, 5.0], lookback: [5, 250]}
  rsi_rebound: {threshold: [10, 50], window: [5, 50]}
  bb_lower_recover: {window: [5, 60], k: [1.0, 4.0]}
  three_down_up: {down_days: [2, 5]}                                  # X6 (r1 제안 범위)
  bb_squeeze_break: {squeeze_lookback: [20, 200]}
  pullback_ma20: {touch_tolerance_pct: [0, 5], max_penetration_pct: [0, 5]}
  granville_buy1: {slope_days: [1, 20]}
  engulfing: {min_body_ratio: [1, 3], trend_days: [1, 20]}
  macd_cross: {fast: [2, 50], slow: [5, 100], signal: [2, 30]}            # fast < slow
  high_52w: {lookback: [60, 250]}                                         # 워밍업 250거래일 안
  disparity_rebound: {window: [5, 120], threshold: [70, 98]}
  stochastic_rebound: {k_window: [5, 50], d_window: [2, 10], oversold: [5, 40]}

exit:                               # A8 기본값
  stop_loss_pct: -8
  take_profit_pct: 20
  max_hold_days: 20
  trailing_stop_pct: null           # 이번 릴리스는 null만 허용

exit_limits:                        # A8 허용 범위
  stop_loss_pct: [-50, -1]
  take_profit_pct: [1, 200]
  max_hold_days: [1, 250]
  trailing_stop_pct: [-50, -1]      # 2026-10-07 선택 청산(기본 꺼짐): 보유 중 최고 기준가 대비 하락률
  breakeven_trigger_pct: [1, 100]   # 이 수익률을 한 번 넘으면 손절선을 진입가(0%)로 올림
  ma_exit_window: [5, 250]          # 종가가 N일 이동평균 아래로 내려가면 청산

execution:
  limit_up_pct: 30                  # A11 원주가 기준 상한가
  limit_down_pct: -30               # A11 원주가 기준 하한가
  round_trip_cost_pct: 0.30         # FR-E4

analysis:
  min_cell_trades: 300              # FR-A2 표본 부족 기준
  split_date: "2024-02-29"          # FR-A3
  fdr_q: 0.10                       # A12 단측 t-검정 → BH
  random_bench_iterations: 1000     # A13
  random_seed: 20260918             # A13 시드 고정
  # --- [V1·V2 확정 2026-10-01] S11에서 잠정 적용한 판정 기준을 사용자가 확정 (구현_전_결정사항 §2.2) ---
  split_pass_judgements: [maintained, weakened]   # FR-A3 기간 분할 통과 판정 (진입일 기준 전/후반, 양쪽 평균 초과수익 > 0)
  random_bench_pass_percentile: 0.95              # FR-A4/A5 실제 평균 초과수익의 무작위 분포 백분위 통과 기준
  risk_free_rate: 0.0               # A9

search:                             # D-1 역방향 탐색 (docs/역방향_백테스트_설계.md §3)
  max_candidates: 200               # 탐색 1회 후보 수 상한 (NFR-14). 넘으면 실행하지 않는다
  sec_per_candidate: 2.5            # 예상 시간 = 후보 수 × 이 값. 실데이터 3,095종목 기본 57후보 실측 2.27초/후보(PR #14 뒤, 2026-10-02) + 여유
  min_trades_default: 300           # 최소 거래 수 기본값 (analysis.min_cell_trades 와 같은 기준)
  target_win_rate_default: 0.40     # 화면 입력의 목표 승률 첫 값 (0~1). 실데이터 기본 57후보 중 거래 300건 이상의 탐색 승률 최대 42.8%·중앙값 39.0%
                                    # (2026-10-02 실측) → 55% 면 충족 후보가 없어 40% 로 둔다. 요청에는 필수 입력이라 계산에는 영향 없음
  min_trades_limits: [30, 5000]     # 최소 거래 수 입력 허용 범위
  axes:                             # 축별 허용 값 (이 순서가 후보 순번 순서)
    combine: [and, or]
    stop_loss_pct: [-3, -5, -8, -10, -15, -20, null]
    take_profit_pct: [5, 10, 15, 20, 30, 50, null]
    max_hold_days: [3, 5, 10, 20, 40, 60]
  pattern_axes:                     # P1-4 패턴 수치 축의 허용 값. 그 패턴이 들어간 조합에만 곱해진다
    breakout_vol: {volume_mult: [1.5, 2.0, 2.5, 3.0], lookback: [10, 20, 60]}
    rsi_rebound: {threshold: [20, 25, 30, 35, 40], window: [7, 14, 21]}
    ma_cross_5_20: {fast: [3, 5, 10], slow: [20, 60, 120]}   # 어떤 조합이든 fast < slow
    breakout_20d: {lookback: [10, 20, 60]}
    bb_lower_recover: {window: [10, 20, 40], k: [1.5, 2.0, 2.5]}
    three_down_up: {down_days: [2, 3, 4]}           # X6 (2026-10-02 hongsungmin0315): 기본값 앞뒤 값. 고른 값만큼 그 패턴이 든 조합이 늘어난다
    bb_squeeze_break: {squeeze_lookback: [60, 125, 200]}
    pullback_ma20: {touch_tolerance_pct: [0.5, 1.0, 2.0], max_penetration_pct: [1.0, 2.0, 3.0]}
    granville_buy1: {slope_days: [3, 5, 10]}
    engulfing: {min_body_ratio: [1.0, 1.5, 2.0], trend_days: [3, 5, 10]}
    macd_cross: {fast: [8, 12], slow: [26, 52], signal: [9]}
    high_52w: {lookback: [120, 250]}
    disparity_rebound: {window: [20, 60], threshold: [85.0, 90.0, 95.0]}
    stochastic_rebound: {k_window: [9, 14], d_window: [3], oversold: [20.0, 30.0]}
  defaults:                         # 요청에서 축을 생략했을 때
    patterns: [ma_cross_5_20, breakout_20d, breakout_vol, rsi_rebound, bb_lower_recover]  # 핵심 5종 (10종 전체는 후보 상한 초과)
    combine: [and, or]
    stop_loss_pct: [-8]
    take_profit_pct: [20]
    max_hold_days: [20]

rag:                                # P3-11 근거 검색 (역방향 탐색 search 절과 다름). 수치는 모두 잠정, 평가셋 dev 분할로 조정한다
  index_fields: [title, corp_name]  # 제품 색인 필드. 2026-10-08 사용자 결정: 제품은 제목·회사명만 (요약은 개인 실험에서만 비교)
  k1: 1.5                           # BM25 단어 빈도 포화
  b: 0.75                           # BM25 문서 길이 보정
  top_k: 5                          # 기본 반환 수
  max_k: 20                         # 요청 k 상한
  candidate_k: 20                   # MMR 을 켤 때 다시 고를 BM25 후보 수
  mmr_lambda: null                  # null 이면 MMR 끔. 0~1 (1 이면 BM25 순서와 같음). 묶기를 켜면 쓰지 않는다
  group_threshold: 0.3              # 제목이 비슷한 기사 묶기: 질의 글자를 뺀 제목 자카드 ≥ 이 값이면 앞 묶음에 넣음. null 이면 끔.
                                    # 2026-10-08 n8n 엑셀 관찰: 0.2 는 틀이 같은 다른 종목 제목을 묶어 보수적으로 0.3 (평가셋 사건 표시로 조정)
  group_candidate_k: 100            # 묶기 전에 보는 BM25 후보 수 (묶음 크기는 이 안에서만 센다)
  min_score: 0.0                    # 상위 점수가 이 값 이하이면 근거 없음 (no_evidence)
  max_query_len: 200                # 질의 글자 수 상한

minutes:                            # P2-4 1분봉 정규화·시간봉 집계 (docs/분봉_데이터_설계.md §2). PREP_SECTIONS 밖 — 일봉 준비 캐시와 무관
  session_open: "09:00"             # N1 정규장 첫 분
  session_close: "15:30"            # N1 정규장 마지막 분 (종가 단일가 체결 분, 포함). 15:20~15:29 동시호가 포함
  nxt_start: "2026-04-24"           # N5 KRX+NXT 통합 시세 시작일 (P2-1 실사)
  price_basis_tol_pct: 0.2          # N2 가격 기준 판정 허용오차 (P2-4.3에서 사용)
  bar_starts:                       # §2.1 집계 봉 시작 시각. 마지막 봉은 session_close 까지 (길이가 달라도 합치거나 빼지 않음)
    1h: ["09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00"]
    3h: ["09:00", "12:00"]
