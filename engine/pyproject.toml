[project]
name = "regime-lab"
version = "0.1.0"
description = "regime-lab 1단계 분석 엔진 — 과거 데이터 분석 도구이며 투자 권유가 아닙니다."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=16",
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "scipy>=1.13",
]

[project.scripts]
regime-lab = "regime_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regime_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: store/ 원본 데이터가 필요한 테스트 (없으면 skip)",
    "slow: 전종목 배치 등 오래 걸리는 테스트",
]
addopts = "-m 'not slow'"
