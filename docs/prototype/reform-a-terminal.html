<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>regime-lab 개혁안 A — 전체 3열 터미널</title>
<style>
/* ==========================================================================
   토큰 — 원본 프로토타입의 각진 터미널 톤 유지, 값은 저장소 design-tokens 기준
   글자 5단계: 11 메타 · 12 본문/표 · 13 입력/질문 · 16 판정/제목 · 24 핵심 지표
   ========================================================================== */
:root {
  --canvas: #0A0E11;
  --surface: #0D1317;
  --control: #152028;
  --hover: #172229;
  --sel: #11241D;
  --line: #1C2730;
  --line-strong: #2A3944;

  --text: #E6EDF2;
  --muted: #9AA9B3;
  --dim: #7C8C97;

  --mint: #88E6BC;
  --mint-ink: #071F16;
  --mint-line: #2D5B47;
  --up: #EF8F8F;
  --down: #8AC4E8;
  --error: #F2A065;
  --amber: #EAC07A;

  --r: 2px;
  --h-ctl: 24px;
  --h-in: 30px;
  --h-btn: 36px;

  --sans: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", Consolas, ui-monospace, monospace;

  --bar-h: 40px;
  --tab-h: 32px;
  --col1: clamp(264px, 22vw, 320px);
  --col3: clamp(300px, 26vw, 400px);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--canvas); color: var(--text); }
body { font: 400 12px/1.5 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; text-align: inherit; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--mint); outline-offset: -2px; }
svg text { font-family: var(--mono); }

.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.up { color: var(--up); }
.down { color: var(--down); }
.err { color: var(--error); }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }

/* ---------- 앱 프레임 ---------- */
.app { display: grid; grid-template-rows: var(--bar-h) minmax(0, 1fr) auto; height: 100vh; height: 100dvh; }

/* 상단 맥락 줄: 칸마다 아래 열과 같은 폭 변수를 쓴다. 칸 경계선 = 열 경계선 */
.bar { display: grid; grid-template-columns: var(--gh); background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; }
.bar > .cell { display: flex; align-items: center; gap: 8px; min-width: 0; height: 100%; padding: 0 12px; border-right: 1px solid var(--line); }
.bar > .cell:last-child { border-right: 0; justify-content: flex-end; }
.bar > .cell.ctx { container-type: inline-size; }

.mark { width: 14px; height: 14px; border: 2px solid var(--mint); position: relative; flex: none; }
.mark::after { content: ""; position: absolute; inset: 3px; background: var(--mint); }
.wordmark { font-size: 12px; font-weight: 800; letter-spacing: .14em; white-space: nowrap; }

/* 상단 줄 컨트롤 — 높이 24 하나로 통일 */
.chip { display: inline-flex; align-items: center; gap: 6px; height: var(--h-ctl); padding: 0 8px; border: 1px solid var(--line); border-radius: var(--r); font-size: 11px; color: var(--muted); white-space: nowrap; flex: none; }
.chip b { color: var(--text); font-weight: 600; }
.ibtn { display: inline-grid; place-items: center; width: var(--h-ctl); height: var(--h-ctl); border: 1px solid var(--line); border-radius: var(--r); color: var(--muted); flex: none; font-size: 13px; line-height: 1; }
.ibtn:hover { color: var(--text); border-color: var(--line-strong); background: var(--hover); }
.only-mid, .only-narrow { display: none !important; }

/* 실행 맥락: 칸 폭이 줄면 우선순위 낮은 것부터 숨긴다 (잘라서 숨기지 않음) */
.run-ctx { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 12px; white-space: nowrap; }
.run-ctx .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.run-ctx .sep { width: 1px; height: 12px; background: var(--line-strong); flex: none; }
.run-ctx [data-pri] { flex: none; }
@container (max-width: 640px) { .run-ctx [data-pri="3"] { display: none; } }
@container (max-width: 480px) { .run-ctx [data-pri="2"] { display: none; } }
@container (max-width: 300px) { .run-ctx [data-pri="1"] { display: none; } }

.dot { width: 7px; height: 7px; flex: none; background: var(--dim); }
.dot.ok { background: var(--mint); }
.dot.run { background: var(--amber); animation: blink 1s steps(2) infinite; }
.dot.bad { background: var(--error); }
@keyframes blink { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .dot.run { animation: none; } * { transition: none !important; } }

/* 구획 전환 버튼 (모드·세그먼트) */
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r); flex: none; }
.seg button { height: calc(var(--h-ctl) - 2px); padding: 0 10px; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--text); background: var(--hover); }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { color: var(--text); background: var(--control); box-shadow: inset 0 -2px 0 var(--mint); }

/* ---------- 작업 화면 3열 ---------- */
.wsw { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; min-width: 0; }
.ws { --g: var(--col1) minmax(0, 1fr) var(--col3); display: grid; grid-template-columns: var(--g); min-height: 0; min-width: 0; }
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); background: var(--canvas); container-type: inline-size; }
.pane:last-child { border-right: 0; }
.pane-head { display: flex; align-items: stretch; flex: none; height: var(--tab-h); background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.pane-head::-webkit-scrollbar { display: none; }
.pane-head .title { display: flex; align-items: center; padding: 0 14px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.pane-head .aside { margin-left: auto; display: flex; align-items: center; gap: 6px; padding: 0 10px; flex: none; }
.tab { display: flex; align-items: center; padding: 0 14px; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; border-right: 1px solid var(--line); flex: none; }
.tab:hover { color: var(--text); background: var(--hover); }
.tab[aria-selected="true"] { color: var(--text); background: var(--canvas); box-shadow: inset 0 -2px 0 var(--mint); }
.pane-body { flex: 1; min-height: 0; overflow: auto; }
.pane-foot { flex: none; padding: 10px 14px 12px; border-top: 1px solid var(--line); background: var(--surface); }

.switch { display: none; }

.sec { padding: 12px 14px 14px; border-bottom: 1px solid var(--line); }
.sec:last-child { border-bottom: 0; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.sec-h h3 { font-size: 12px; font-weight: 700; }
.sec-h h3 .n { font-family: var(--mono); color: var(--dim); margin-right: 6px; }
.sec-h .aside { font-size: 11px; color: var(--dim); }

/* ---------- 입력 ---------- */
.field { display: grid; gap: 4px; min-width: 0; }
.field > label, .field > .lab { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.in { width: 100%; min-width: 0; height: var(--h-in); padding: 0 8px; background: var(--control); border: 1px solid var(--line-strong); border-radius: var(--r); font-size: 13px; }
.in:focus { border-color: var(--mint); outline: none; }
.in:disabled { opacity: .4; }
.in[aria-invalid="true"] { border-color: var(--error); }
.in.num { text-align: right; }
.unit { display: flex; align-items: stretch; }
.unit .in { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.unit span { display: grid; place-items: center; padding: 0 8px; border: 1px solid var(--line-strong); border-left: 0; background: var(--surface); font-size: 11px; color: var(--muted); border-radius: 0 var(--r) var(--r) 0; white-space: nowrap; }
.hint { font-size: 11px; color: var(--dim); }
.hint.err { color: var(--error); }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

.opt { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 28px; padding: 0 6px; margin: 0 -6px; cursor: pointer; }
.opt:hover { background: var(--hover); }
.opt input { accent-color: var(--mint); width: 14px; height: 14px; }
.opt .p { font-size: 11px; color: var(--dim); font-family: var(--mono); white-space: nowrap; }
.opt .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.tog { height: 28px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--r); font-size: 12px; color: var(--muted); }
.tog:hover { color: var(--text); }
.tog[aria-pressed="true"] { color: var(--text); background: var(--sel); border-color: var(--mint-line); }

.switchrow { display: grid; grid-template-columns: minmax(0, 1fr) 96px; align-items: center; gap: 8px; min-height: 34px; }
.switchrow label { display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; }
.switchrow input[type=checkbox] { accent-color: var(--mint); width: 14px; height: 14px; }

/* ---------- 버튼 ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--h-in); padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--control); font-size: 12px; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--hover); border-color: var(--muted); }
.btn.quiet { background: transparent; }
.btn.danger { color: var(--error); }
.btn-primary { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: var(--h-btn); border-radius: var(--r); background: var(--mint); color: var(--mint-ink); font-size: 13px; font-weight: 800; }
.btn-primary:hover { filter: brightness(1.06); }
.btn-primary:disabled { background: var(--control); color: var(--dim); filter: none; }
.btn-primary kbd { font: 600 11px var(--mono); opacity: .7; }
.link { color: var(--text); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; font-size: 12px; }
.link:hover { text-decoration-color: var(--text); }

.tag { display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; border: 1px solid var(--line-strong); border-radius: var(--r); font-size: 11px; color: var(--muted); white-space: nowrap; }
.tag.ok { color: var(--mint); border-color: var(--mint-line); }
.tag.warn { color: var(--amber); border-color: #5B4A2C; }
.tag.err { color: var(--error); border-color: #5E3E28; }

/* ---------- 표 ---------- */
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl th { position: sticky; top: 0; z-index: 1; background: var(--surface); padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 11px; font-weight: 600; color: var(--muted); text-align: left; white-space: nowrap; }
.tbl td { padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl .r { text-align: right; }
.tbl td.wrap { white-space: normal; min-width: 180px; }
.tbl tr.act { cursor: pointer; }
.tbl tr.act:hover td { background: var(--hover); }
.tbl tr[aria-selected="true"] td { background: var(--sel); }
.tbl tr[aria-selected="true"] td:first-child { box-shadow: inset 2px 0 0 var(--mint); }

/* ---------- 결과: 판정 · 질문형 검증 · 지표 ---------- */
.verdict { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); box-shadow: inset 3px 0 0 var(--mint); }
.verdict.no { box-shadow: inset 3px 0 0 var(--line-strong); }
.verdict h2 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.verdict p { margin-top: 4px; color: var(--muted); max-width: 72ch; }
.verdict .meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11px; color: var(--dim); }

.checks { border-bottom: 1px solid var(--line); }
.check { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; padding: 10px 16px; border-top: 1px solid var(--line); }
.check:first-child { border-top: 0; }
.check .q { font-size: 13px; font-weight: 600; }
.check .ev { color: var(--muted); }
.check .st { grid-column: 2; grid-row: 1 / 3; align-self: center; font-size: 12px; font-weight: 700; white-space: nowrap; }
.check .st.pass::before { content: "✓ "; color: var(--mint); }
.check .st.fail { color: var(--error); }
.check .st.fail::before { content: "✕ "; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.kpi { padding: 12px 16px; border-right: 1px solid var(--line); min-width: 0; }
.kpi:last-child { border-right: 0; }
.kpi .k { font-size: 11px; color: var(--muted); }
.kpi .v { font: 700 24px/1.25 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpi .s { font-size: 11px; color: var(--dim); }
@container (max-width: 560px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(2) { border-right: 0; }
  .kpi:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
}

.block { padding: 14px 16px; border-bottom: 1px solid var(--line); }
.block-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.block-h h3 { font-size: 13px; font-weight: 700; }
.block-h .aside { font-size: 11px; color: var(--dim); }

/* 국면 × 규모 */
.mx { display: grid; grid-template-columns: 64px repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.mx > * { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
.mx .h { padding: 6px 8px; font-size: 11px; color: var(--muted); background: var(--surface); }
.mx .h.c { text-align: right; }
.mx .cell { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 1px; padding: 8px; min-height: 50px; }
.mx .cell:hover { background: var(--hover); }
.mx .cell .v { font: 600 14px var(--mono); font-variant-numeric: tabular-nums; }
.mx .cell .n { font: 400 11px var(--mono); color: var(--dim); }
.mx .cell.thin { background-image: repeating-linear-gradient(135deg, transparent 0 6px, rgba(234, 192, 122, .08) 6px 7px); }
.mx .cell.thin .v { opacity: .5; }
.mx .cell.thin .n { color: var(--amber); }
.mx .cell[aria-pressed="true"] { background-color: var(--sel); box-shadow: inset 0 0 0 1px var(--mint); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 11px; color: var(--dim); }
.legend i { display: inline-block; width: 10px; height: 10px; vertical-align: -1px; margin-right: 4px; border: 1px solid var(--line-strong); }
.legend i.hatch { background: repeating-linear-gradient(135deg, transparent 0 2px, rgba(234, 192, 122, .45) 2px 3px); }

details.more > summary { list-style: none; cursor: pointer; padding: 12px 16px; font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: "펼치기 ▾"; font-size: 11px; font-weight: 400; color: var(--dim); }
details.more[open] > summary::after { content: "접기 ▴"; }

/* ---------- 상태 ---------- */
.state { padding: 32px 20px; max-width: 520px; }
.state h2 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.state p { margin-top: 6px; color: var(--muted); }
.state .actions { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
.steps { margin-top: 16px; display: grid; gap: 6px; }
.step { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12px; color: var(--dim); }
.step.done { color: var(--muted); }
.step.done::before { content: "✓"; color: var(--mint); }
.step.now { color: var(--text); font-weight: 600; }
.step.now::before { content: "▸"; color: var(--amber); }
.step.todo::before { content: "·"; }
.meter { height: 4px; background: var(--control); margin-top: 14px; }
.meter > i { display: block; height: 100%; background: var(--amber); transition: width .3s; }

.notice { padding: 8px 12px; border: 1px solid var(--line); border-left: 2px solid var(--line-strong); color: var(--muted); font-size: 11px; }
.notice.fixed { border-left-color: var(--amber); color: var(--text); }

.filter { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface); font-size: 11px; color: var(--muted); }
.filter b { color: var(--text); font-weight: 600; }

/* ---------- 문서 목록 ---------- */
.doc { display: block; width: 100%; padding: 10px 14px; border-bottom: 1px solid var(--line); }
button.doc:hover { background: var(--hover); }
.doc[aria-selected="true"] { background: var(--sel); box-shadow: inset 2px 0 0 var(--mint); }
.doc .t { font-size: 13px; font-weight: 600; line-height: 1.45; }
.doc .m { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 11px; color: var(--dim); }

.prose { padding: 16px; font-size: 13px; line-height: 1.75; color: #CAD6DE; max-width: 72ch; }
.prose p + p { margin-top: 10px; }
.prose b { color: var(--text); }

/* ---------- 차트 ---------- */
.chart { width: 100%; height: auto; display: block; }
.chart .axis { stroke: var(--line-strong); stroke-width: 1; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart text { fill: var(--dim); font-size: 11px; }

/* ---------- 바닥 줄 ---------- */
.foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 26px; padding: 4px 12px; background: var(--surface); border-top: 1px solid var(--line); font-size: 11px; color: var(--dim); }
.foot .disc { color: var(--muted); }
.foot .tools { display: flex; align-items: center; gap: 10px; flex: none; }
.foot select { height: 20px; background: var(--control); border: 1px solid var(--line-strong); border-radius: var(--r); font-size: 11px; padding: 0 4px; }
.foot a { color: var(--muted); }
.kbd { font-family: var(--mono); color: var(--muted); }

/* ---------- 넓은 화면 아래: 조건 열을 서랍으로 ---------- */
.scrim { display: none; }
@media (min-width: 1024px) and (max-width: 1279px) {
  .only-mid { display: inline-flex !important; }
  .ws { --g: minmax(0, 1fr) var(--col3); }
  .ws > .pane.p1 { position: fixed; z-index: 30; top: var(--bar-h); bottom: 0; left: var(--drawer-left, 0); width: 320px; transform: translateX(-110%); transition: transform .16s ease; box-shadow: 8px 0 24px rgba(0, 0, 0, .45); border-right: 1px solid var(--line-strong); }
  .drawer-open .ws > .pane.p1 { transform: none; }
  .drawer-open .scrim { display: block; position: fixed; inset: var(--bar-h) 0 0 0; z-index: 25; background: rgba(0, 0, 0, .35); }
}

/* ---------- 좁은 화면: 한 열 + 조건/결과/근거 전환 ---------- */
@media (max-width: 1023px) {
  .only-narrow { display: inline-flex !important; }
  .hide-narrow { display: none !important; }
  .switch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--surface); border-bottom: 1px solid var(--line); }
  .switch button { height: 36px; font-size: 12px; font-weight: 600; color: var(--muted); border-right: 1px solid var(--line); text-align: center; }
  .switch button:last-child { border-right: 0; }
  .switch button[aria-selected="true"] { color: var(--text); box-shadow: inset 0 -2px 0 var(--mint); background: var(--canvas); }
  .ws { --g: minmax(0, 1fr); }
  .ws > .pane { display: none; border-right: 0; }
  .ws > .pane.on { display: flex; }
  .foot .tools .hide-narrow { display: none; }
}
@media (max-width: 560px) {
  .foot { flex-direction: column; align-items: flex-start; gap: 2px; }
  .mx { grid-template-columns: 48px repeat(3, minmax(0, 1fr)); }
  .mx .cell { padding: 6px; }
  .mx .cell .v { font-size: 12px; }
}

/* ---------- 알림 ---------- */
#toast { position: fixed; right: 16px; bottom: 40px; z-index: 60; max-width: min(380px, calc(100vw - 32px)); padding: 10px 12px; background: var(--control); border: 1px solid var(--line-strong); border-left: 2px solid var(--mint); border-radius: var(--r); font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
#toast[hidden] { display: none; }

   A안 셸 — 모든 화면이 3열. 상단 왼쪽 칸에서 작업 모드를 바꾸면 세 열이 함께 바뀐다

<script>

   분할일 2024-02-29, 왕복 비용 0.30%, 청산 기본 −8/20/20, 탐색 후보 상한 200·최소 거래 300)
   ========================================================================== */

/* ---------- 유틸 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const int = (n) => Math.round(n).toLocaleString('ko-KR');
const sgn = (n, d = 2, u = '%') => `${n > 0 ? '+' : n < 0 ? '−' : ''}${Math.abs(n).toFixed(d)}${u}`;
const tone = (n) => (n > 0 ? 'up' : n < 0 ? 'down' : '');
const arrow = (n) => (n > 0 ? '▲' : n < 0 ? '▼' : '');
const signed = (n, d = 2, u = '%') => `<span class="num ${tone(n)}"><span aria-hidden="true">${arrow(n)} </span>${sgn(n, d, u)}</span>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gauss(r) { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

/* ---------- 설정·메타 (설정 파일·데이터에서 온 값으로 취급) ---------- */
const META = {

  disclaimer: '과거 데이터 분석이며 투자 권유가 아닙니다 · Historical analysis — not investment advice.',

const PATTERNS = [
  ['ma_cross_5_20', '5/20 골든크로스', '5·20일'], ['breakout_20d', '20일 고가 돌파', '20일'],

].map(([id, name, p]) => ({ id, name, p }));
const PNAME = Object.fromEntries(PATTERNS.map((p) => [p.id, p.name]));

/* 시장 국면 (지수 기준, 신호일 값) */
const REGIMES = [

  ['2025-04-01', '2026-09-30', '상승'],
];
const regimeOf = (d) => (REGIMES.find(([a, b]) => d >= a && d <= b) || [])[2] || '국면 없음';

const DAYS = (() => { const out = []; const d = new Date(META.dataStart + 'T00:00:00Z'); const end = new Date(META.dataEnd + 'T00:00:00Z');
  while (d <= end) { const w = d.getUTCDay(); if (w && w < 6) out.push(d.toISOString().slice(0, 10)); d.setUTCDate(d.getUTCDate() + 1); } return out; })();

/* 국면 × 규모: 평균 초과수익(%p)과 거래 수. 300건 미만은 표본 부족 */
const MX = {

const STOCKS = [
  ['247540', '에코프로비엠', '대형', 0.9], ['196170', '알테오젠', '대형', 0.7], ['000660', 'SK하이닉스', '대형', 0.8],
  ['086520', '에코프로', '대형', 0.4], ['005930', '삼성전자', '대형', 0.3], ['068270', '셀트리온', '대형', 0.5],
  ['035720', '카카오', '대형', -0.6], ['028300', 'HLB', '중형', -0.4], ['263750', '펄어비스', '중형', 0.2],
  ['293490', '카카오게임즈', '중형', 0.1], ['041510', '에스엠', '중형', -0.9], ['035900', 'JYP Ent.', '중형', -0.7],

].map(([code, name, size, m], i) => {
  const r = rng(101 + i * 7); const n = 8 + Math.floor(r() * 7); const trades = [];
  for (let k = 0; k < n; k++) {
    const ei = 260 + Math.floor(r() * (DAYS.length - 300)); let ret = m - 1.2 + gauss(r) * 6; let reason = '최대 보유'; let hold = 20;
    if (ret >= 20) { ret = 20; reason = '익절'; hold = 4 + Math.floor(r() * 14); }
    else if (ret <= -8) { ret = -8 - r() * 0.7; reason = '손절'; hold = 2 + Math.floor(r() * 15); }
    const xi = Math.min(ei + hold, DAYS.length - 1);
    trades.push({ entry: DAYS[ei], exit: DAYS[xi], ei, xi, hold, reason, net: ret - META.cost, regime: regimeOf(DAYS[ei]), size });
  }
  trades.sort((a, b) => (a.entry < b.entry ? 1 : -1));
  return { code, name, size, trades, seed: 900 + i };
});

/* 실행 전체 거래(1,842건) — 곡선·분포·핵심 지표를 같은 표본에서 계산 */
const RUN_TRADES = (() => { const r = rng(7); const out = [];
  for (let i = 0; i < 1842; i++) { let ret = r() < 0.42 ? 0.3 + Math.abs(gauss(r)) * 6.5 : 0.3 - Math.abs(gauss(r)) * 3.2; if (ret >= 20) ret = 20; if (ret <= -8) ret = -8 - r() * 0.6; out.push(ret - META.cost); }
  return out; })();
const RUN_STATS = (() => { const a = RUN_TRADES; const wins = a.filter((x) => x > 0); const loss = a.filter((x) => x <= 0); const s = [...a].sort((x, y) => x - y);
  const mean = (v) => v.reduce((p, c) => p + c, 0) / v.length;
  return { n: a.length, win: (wins.length / a.length) * 100, avg: mean(a), median: s[Math.floor(s.length / 2)], payoff: mean(wins) / Math.abs(mean(loss)) }; })();

const RUNS = [
  { id: '20261013T101522_rsi_bb', name: 'RSI 회복 + 볼린저 하단 회복', at: '2026-10-13 10:15', n: 1842, win: RUN_STATS.win, target: true, state: '완료' },
  { id: '20261012T121528_ui_check', name: '5/20 골든크로스', at: '2026-10-12 12:15', n: 2410, win: 38.9, target: false, state: '완료' },
  { id: '20261011T174402_high52', name: '52주 신고가 돌파', at: '2026-10-11 17:44', n: 1266, win: 40.3, target: false, state: '완료' },
  { id: '20261011T093015_vol', name: '거래량 동반 돌파', at: '2026-10-11 09:30', n: 0, win: 0, target: false, state: '실패' },
  { id: '20261010T151247_pullback', name: '20일선 눌림목', at: '2026-10-10 15:12', n: 3021, win: 42.6, target: false, state: '완료' },
];

const PRESETS = [
  { name: 'RSI 회복 + 볼린저 하단 회복', saved: '2026-10-13', pats: ['rsi_rebound', 'bb_lower_recover'], combine: 'OR', exits: '손절 −8% · 익절 20% · 20거래일', uni: '코스피·코스닥 · 전 규모 · 5억 원' },
  { name: '눌림목 보수형', saved: '2026-10-10', pats: ['pullback_ma20'], combine: 'AND', exits: '손절 −5% · 익절 10% · 10거래일 · 본전 스톱 5%', uni: '코스피 · 대형·중형 · 20억 원' },
  { name: '신고가 추세', saved: '2026-10-08', pats: ['high_52w', 'breakout_vol'], combine: 'AND', exits: '손절 −8% · 트레일링 −12% · 40거래일', uni: '코스닥 · 전 규모 · 10억 원' },
];

const DOCS = [
  ['OpenDART', '247540', '에코프로비엠', '단일판매ㆍ공급계약체결', '2024-03-08T14:22:00+09:00'],
  ['뉴스', '247540', '에코프로비엠', '에코프로비엠, 양극재 장기 공급계약 공시', '2024-03-08T15:02:00+09:00'],
  ['뉴스', '247540', '에코프로비엠', '에코프로비엠 공급계약 소식에 2차전지 소재주 동반 관심', '2024-03-08T16:40:00+09:00'],
  ['OpenDART', '247540', '에코프로비엠', '임원ㆍ주요주주특정증권등소유상황보고서', '2024-03-05T17:11:00+09:00'],
  ['OpenDART', '196170', '알테오젠', '주요사항보고서(유상증자결정)', '2024-02-27T16:30:00+09:00'],
  ['뉴스', '000660', 'SK하이닉스', 'SK하이닉스, 신규 생산시설 투자 계획 발표', '2024-03-07T09:12:00+09:00'],

/* ---------- 상태 ---------- */
const S = {

  resTab: 'summary',    // summary · curve · regime

  b: { pats: new Set(['rsi_rebound', 'bb_lower_recover']), combine: 'OR', stopOn: true, stop: -8, tpOn: true, tp: 20, hold: 20,
    trailOn: false, trail: -12, beOn: false, be: 7, maOn: false, ma: 20, mk: new Set(['KOSPI', 'KOSDAQ']), sz: new Set(['대형', '중형', '소형']), minVal: 5, name: '' },

/* ---------- 이벤트 위임 ---------- */
const ACT = {};
const on = (name, fn) => { ACT[name] = fn; };
let paint = () => {};             // 화면안이 정의한다 (영역 다시 그리기)
const setPaint = (fn) => { paint = fn; };

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) { fn(el, e); }
});
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (t.getAttribute && t.getAttribute('role') === 'tab' && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
    const list = $$('[role=tab]', t.closest('[role=tablist]')); let i = list.indexOf(t);
    i = e.key === 'Home' ? 0 : e.key === 'End' ? list.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + list.length) % list.length;
    list[i].focus(); list[i].click(); e.preventDefault();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); if (ACT.run) ACT.run(); }
  if (e.key === 'Escape' && ACT.escape) ACT.escape();
});
function keepFocus(fn) {   // 다시 그린 뒤 같은 id 요소로 초점 복귀
  const id = document.activeElement && document.activeElement.id; fn();
  if (id) { const el = document.getElementById(id); if (el) el.focus(); }
}

/* ---------- 공통 조각 ---------- */
function tabs(group, items, cur, label) {
  return `<div role="tablist" aria-label="${label}" style="display:flex">${items.map(([k, t]) =>

}
on('tab', (el) => { S[el.dataset.g] = el.dataset.k; if (el.dataset.g === 'insTab') { S.stock = null; } keepFocus(() => paint()); });

/* ---------- 상단 줄: 실행 맥락 · 데이터 상태 ---------- */
function runCtx() {
  if (S.run === 'none') return `<div class="run-ctx"><span class="dot"></span><span class="name muted">실행한 전략 없음</span></div>`;
  if (S.run === 'running') return `<div class="run-ctx" aria-live="polite"><span class="dot run"></span><span class="name">${esc(S.runName)}</span><span class="sep" data-pri="2"></span><span class="num" data-pri="2">실행 중 ${Math.round(S.progress)}%</span></div>`;
  if (S.run === 'error') return `<div class="run-ctx"><span class="dot bad"></span><span class="name">${esc(S.runName)}</span><span class="sep" data-pri="1"></span><span class="err" data-pri="1">실행 실패</span></div>`;
  const pass = S.run === 'ok' ? 3 : 2;
  return `<div class="run-ctx" title="${RUNS[0].id}">
    <span class="dot ok"></span><span class="name">${esc(S.runName)}</span>

    <span class="sep" data-pri="2"></span><span class="num" data-pri="2">${int(RUN_STATS.n)}건</span>
    <span class="sep" data-pri="1"></span><span data-pri="1" class="${pass === 3 ? '' : 'err'}">검증 <b class="num">${pass}/3</b> ${pass === 3 ? '통과' : '— 분석 대상 아님'}</span>
  </div>`;
}
function dataStatus() {
  return `<span class="chip hide-narrow" title="시세 데이터 마지막 거래일"><span class="hide-mid">데이터</span><b class="num">${META.dataEnd}</b></span>
    <span class="chip hide-narrow" title="종목 범위"><b>전 종목</b><span class="num">${int(META.tickers)}</span></span>
    <button class="ibtn" data-act="settings" aria-label="설정" title="설정">⚙</button>`;
}
on('settings', () => toast('설정: 언어(한국어/English) · AI 보고서 키 · 데이터 정보 — 프로토타입에서는 열지 않습니다.'));

/* ---------- 1열: 전략 만들기 ---------- */
function validate() {
  const b = S.b, L = META.limits, err = {};
  const chk = (k, on, v) => { if (!on) return; if (v === '' || Number.isNaN(+v)) err[k] = '값을 입력하세요'; else if (+v < L[k][0] || +v > L[k][1]) err[k] = `${L[k][0]} ~ ${L[k][1]} 사이로 입력하세요`; };
  chk('stop', b.stopOn, b.stop); chk('tp', b.tpOn, b.tp); chk('hold', true, b.hold); chk('trail', b.trailOn, b.trail); chk('be', b.beOn, b.be); chk('ma', b.maOn, b.ma);
  if (!b.pats.size) err.pats = '패턴을 하나 이상 고르세요';
  if (!b.mk.size) err.mk = '시장을 하나 이상 고르세요';
  if (!b.sz.size) err.sz = '규모를 하나 이상 고르세요';
  return err;
}
function estimate() {
  const b = S.b; const mk = (b.mk.has('KOSPI') ? 0.36 : 0) + (b.mk.has('KOSDAQ') ? 0.64 : 0);

function forecastView() {
  const s = STOCKS.find((x) => x.code === S.fc.code); const r = rng(s.seed + (S.fc.tf === '1h' ? 1 : 3)); const past = []; let p = 52000 + r() * 30000;
  for (let i = 0; i < 40; i++) past.push((p *= Math.exp(gauss(r) * (S.fc.tf === '1h' ? 0.006 : 0.011))));
  const hz = S.fc.tf === '1h' ? 7 : 2; const last = past[past.length - 1]; const band = []; for (let k = 1; k <= hz; k++) { const w = (S.fc.tf === '1h' ? 0.009 : 0.016) * Math.sqrt(k) * 1.28; band.push([last * (1 - w), last * (1 + w * 1.04)]); }
  const all = past.concat(band.flat()); const lo = Math.min(...all), hi = Math.max(...all); const W = 640, H = 220, n = past.length + hz;
  const X = (i) => 8 + (i / (n - 1)) * (W - 70); const Y = (v) => 10 + (1 - (v - lo) / (hi - lo)) * (H - 40);
  const poly = [[past.length - 1, last, last], ...band.map((b, k) => [past.length + k, b[0], b[1]])];
  const area = poly.map(([i, , u]) => `${X(i).toFixed(1)},${Y(u).toFixed(1)}`).concat(poly.slice().reverse().map(([i, l]) => `${X(i).toFixed(1)},${Y(l).toFixed(1)}`)).join(' ');
  const prob = 0.47 + r() * 0.14; const dir = prob >= 0.55 ? '상승 쪽' : prob <= 0.45 ? '하락 쪽' : '불확실';
  return `<section class="block"><div class="block-h"><h3>${s.name} · ${S.fc.tf === '1h' ? '1시간봉' : '3시간봉'} 다음 ${hz}봉</h3><span class="aside">as_of 2026-09-30 15:30 KST · 모델 2026-05-29 학습</span></div>
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="지난 40봉 종가와 다음 ${hz}봉의 회색 예상 범위">
        <polygon points="${area}" fill="rgba(154,169,179,.22)" stroke="rgba(154,169,179,.5)"/>
        <polyline points="${past.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--text)" stroke-width="1.5"/>
        <line class="grid" x1="${X(past.length - 1)}" x2="${X(past.length - 1)}" y1="6" y2="${H - 28}" stroke-dasharray="3 3"/>
        <text x="${X(past.length - 1) + 4}" y="18">as_of</text><text x="${W - 58}" y="${Y(band[hz - 1][1]) + 4}">10~90%</text>
        <line class="axis" x1="8" x2="${W - 62}" y1="${H - 28}" y2="${H - 28}"/></svg>
      <div class="legend"><span><i style="background:rgba(154,169,179,.35)"></i>예상 범위 (분위 0.1–0.9)</span><span>직전 종가 <b class="num" style="color:var(--text)">${int(last)}</b>원</span><span>표시 방향 <b style="color:var(--text)">${dir}</b> (상승 확률 <span class="num">${prob.toFixed(2)}</span>)</span></div>
      <div class="notice fixed" style="margin-top:10px">${META.fixedForecast}</div></section>
    <section class="block"><div class="block-h"><h3>최종 평가 구간 채점</h3><span class="aside">2026-06-01 – ${META.dataEnd} · 시간 순서 분할</span></div>
      <table class="tbl"><tbody><tr><td>범위 적중률 (실제 종가가 회색 구간 안)</td><td class="r num">78.4%</td></tr><tr><td>방향을 낸 표본의 적중률</td><td class="r num">53.1% <span class="dim">(n=1,204)</span></td></tr><tr><td>기준선 (직전 종가 유지) 대비</td><td class="r num">+1.8%p</td></tr></tbody></table></section>`;
}

function col3() {
  if (S.mode === 'docs') return `<div class="pane-head">${tabs('docSide', [['detail', '자료 상세'], ['influence', '영향 분석']], S.docSide, '상세')}</div>
    <div class="pane-body">${S.docSide === 'influence' ? influenceView() : docDetail()}</div>`;
  if (S.mode === 'market') { const s = STOCKS.find((x) => x.code === S.fc.code); const near = DOCS.filter((d) => d.code === s.code);
    return `<div class="pane-head"><div class="title">근거 · ${s.name}</div></div><div class="pane-body">
      <div class="filter"><span>예측 입력은 가격만 (자료 특징은 통합 모델 P4-3 뒤)</span></div>
      ${near.length ? near.map((d) => `<div class="doc"><div class="t">${esc(d.title)}</div><div class="m"><span>${d.src === 'OpenDART' ? '공시' : '뉴스'}</span><span class="num">${d.kst} KST</span></div></div>`).join('') : '<div class="state"><p>이 종목의 최근 공시·뉴스 제목이 없습니다.</p></div>'}</div>`; }
  return `<div class="pane-head">${inspectorHead()}</div><div class="pane-body">${inspectorBody()}</div>`;
}
/* docs 모드: 목록에서 고르면 3열 상세 */
function docListPickable() {
  const list = visibleDocs();
  if (!list.length) return docList();
  return list.map((d) => `<button class="doc" data-act="docPick" data-k="${d.i}" aria-selected="${S.docSel === d.i}"><div class="t">${esc(d.title)}</div><div class="m"><span class="tag">${d.src === 'OpenDART' ? '공시' : '뉴스'}</span><span>${d.company} <span class="num">${d.code}</span></span><span class="num">${d.kst} KST</span></div></button>`).join('');
}
const _docList = docList;   // 검색 입력이 #doc-list 를 다시 그릴 때 docs 모드는 고를 수 있는 목록으로
docList = function () { return S.mode === 'docs' ? (visibleDocs().length ? docListPickable() : _docList()) : _docList(); };

function paintA() {
  const app = $('#app');
  $('#bar').innerHTML = bar();
  const p1 = $('#p1');
  if (S.mode !== 'test' || S.c1 !== 'build' || S.bDirty || !$('#builder-body')) { p1.innerHTML = col1(); S.bDirty = false; if (S.mode === 'test' && S.c1 === 'build') syncBuilder(); }
  else { const f = $('#builder-foot'); if (f) f.innerHTML = builderFoot(); }
  p1.setAttribute('aria-label', SWITCH[S.mode][0]);
  $('#p2').innerHTML = col2(); $('#p2').setAttribute('aria-label', SWITCH[S.mode][1]);
  $('#p3').innerHTML = col3(); $('#p3').setAttribute('aria-label', SWITCH[S.mode][2]);
  $('#switch').innerHTML = SWITCH[S.mode].map((t, i) => `<button role="tab" aria-selected="${S.pane === i}" data-act="pane" data-k="${i}">${t}</button>`).join('');
  ['#p1', '#p2', '#p3'].forEach((id, i) => $(id).classList.toggle('on', S.pane === i));
  $('#foot').innerHTML = footer('reform-b-hybrid.html', 'B안 보기');
}
setPaint(() => keepFocus(paintA));

on('mode', (el) => { S.mode = el.dataset.k; S.pane = 1; S.bDirty = true; document.body.classList.remove('drawer-open'); paint(); });
on('pane', (el) => { S.pane = +el.dataset.k; paint(); });
on('drawer', () => { document.body.classList.toggle('drawer-open'); const p = $('#p1 [role=tab], #p1 input, #p1 button'); if (p && document.body.classList.contains('drawer-open')) p.focus(); });
on('closeDrawer', () => document.body.classList.remove('drawer-open'));
ACT.escape = () => document.body.classList.remove('drawer-open');
const _tab = ACT.tab; on('tab', (el) => { if (el.dataset.g === 'c1') S.bDirty = true; _tab(el); });
ACT.onRunStart = () => { S.pane = 1; document.body.classList.remove('drawer-open'); };
ACT.onCell = () => { if (innerWidth < 1024) S.pane = 2; };
ACT.onStock = () => { if (innerWidth < 1024) S.pane = 2; };
ACT.onOpenRun = () => { S.pane = 1; };
ACT.onPresetLoad = () => { S.c1 = 'build'; S.pane = 0; };
ACT.onCand = () => { S.c1 = 'build'; S.pane = 0; };
ACT.onDocPick = () => { S.docSide = 'detail'; if (innerWidth < 1024) S.pane = 2; };
on('go', (el) => { S.mode = 'test'; S.c1 = el.dataset.k; S.pane = 0; S.bDirty = true; document.body.classList.add('drawer-open'); paint(); });

paint();
</script>
</body>
</html>
