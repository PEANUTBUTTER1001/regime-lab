# 외부 자료 수집 설정 (P3-7). 수치는 여기에만 둔다. 인증키는 환경변수 DART_API_KEY 로만 받는다.
opendart:
  base_url: https://opendart.fss.or.kr/api/list.json
  viewer_url: https://dart.fss.or.kr/dsaf001/main.do?rcpNo=   # 화면에 보일 링크 (원문은 저장하지 않음)
  corp_cls: [Y, K]                 # 유가증권·코스닥만
  page_count: 100                  # API 허용 1~100
  window_months: 1                 # corp_code 없이 조회하면 검색기간 최대 3개월 → 1개월 창 (plan/03-04 §6.1)
  request_interval_sec: 0.5        # 요청 사이 최소 간격
  daily_request_limit: 10000       # 하루 요청 상한 (오류 020 은 대략 20,000건 이상). 넘으면 커서 저장 후 partial 종료
  max_retries: 3                   # 일시 오류 재시도 (지수 백오프)
  backoff_base_sec: 2.0
  timeout_sec: 30
  license_scope: metadata_only     # D-4 공시 범위 C (2026-10-07 hongsungmin0315 동의, hchee99 확인 대기)
  user_agent: regime-lab-ingest/0.1 (SeSAC final project; research)
# 시각 규칙 (plan/03-04 §4). KST 고정
timing:
  tz: Asia/Seoul
