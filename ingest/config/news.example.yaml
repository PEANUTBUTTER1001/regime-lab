# P3-8 example: inactive until source ledger/G2 review. No credentials in YAML.
active: false
license_scope: metadata_only
queries: []  # explicit watchlist only; no automatic all-market expansion
request_limit: 10  # includes retries; persistent daily quota checked before dispatch
daily_request_limit: 100  # local budget, not Naver's account-wide remaining quota
display: 20
page_limit: 1
max_retries: 2
request_interval_sec: 0.5
backoff_base_sec: 2.0
max_retry_wait_sec: 60
timeout_sec: 30
response_max_bytes: 1048576
user_agent: regime-lab-ingest/0.1
